name: Check new Mint circulation releases
on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: mint-release-review
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test discovery and approval boundary
        run: python3 test-release-watch.py
      - name: Check official Mint sources and request review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 check-releases.py --publish
